<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <link rel="stylesheet" href="recipe.css">
    <title>RECIPE BOOK</title>
</head>
<body>
    <h1>WELCOME TO MY RECIPE BOOK!&#128522</h1>
    <p>Enter your favorite dish name&#128513:</p>
    <div id="dishname">
        <select name="Dish Name" id="dishes">
            <option value="Pasta">Pasta</option>
            <option value="Pizza">Pizza</option>
            <option value="Lasagna">Lasagna</option>
            <option value="Burrito Bowl">Burrito Bowl</option>
            <option value="Brownie">Brownie</option>
            <option value="Avocado Toast">Avocado Toast</option>
        </select>
        
        <button id="enter">Enter</button>
    </div>
    <div id="arrow">
        <button id="barrow1"><</button>
        <button id="barrow2">></button>
    </div>
    <p id="dishnm"></p>
    <div id="recipe">
        <video id="img" muted playsinline loop src="cover.mp4"></video>
        <p id="txt"></p>
    </div>
    <p>Enjoy your meal!&#128516</p>
    <p></p>
    <script src="recipes.js"></script>
    <script src="recipe.js"></script>
</body>
</html>
